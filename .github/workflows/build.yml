name: Build PS2-Launcher

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PS2-Launcher
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH
          
          # Compile full release
          make clean || true
          make -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir -p release
          cp *.ELF release/ 2>/dev/null || true
          cp *.elf release/ 2>/dev/null || true
          if [ -f "release/PS2L.ELF" ]; then
            cp release/PS2L.ELF release/PS2-Launcher-4.0.0.ELF
          fi
          cd release && zip -r PS2-Launcher-Build.zip .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-ELF
          path: release/
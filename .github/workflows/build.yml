name: Build PS2-Launcher

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Install host dependencies
        run: |
          git config --global --add safe.directory "*"
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache bash make git zip coreutils findutils sed grep || true
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq bash make git zip coreutils findutils || true
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and configure lwNBD module
        run: |
          git config --global --add safe.directory "*"
          if [ ! -d "modules/network/lwNBD" ] || [ ! -f "modules/network/lwNBD/Makefile" ]; then
            rm -rf modules/network/lwNBD
            git clone --depth 1 https://github.com/ps2homebrew/lwNBD.git modules/network/lwNBD
          fi
          touch modules/network/lwNBD/.config
          echo "CONFIG_NBD=y" > modules/network/lwNBD/.config
          echo "CONFIG_BLOCK=y" >> modules/network/lwNBD/.config

      - name: Build PS2-Launcher
        run: |
          git config --global --add safe.directory "*"
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH
          
          # Clean and compile full release
          make clean || true
          make -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir -p release
          if [ -f "OPNPS2LD.ELF" ]; then
            cp OPNPS2LD.ELF release/PS2-Launcher-4.0.0.ELF
            cp OPNPS2LD.ELF release/OPNPS2LD.ELF
          elif [ -f "PS2-Launcher.ELF" ]; then
            cp PS2-Launcher.ELF release/PS2-Launcher-4.0.0.ELF
          fi
          cd release && zip -r PS2-Launcher-Build.zip *

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-ELF
          path: release/
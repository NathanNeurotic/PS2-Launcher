name: Build PS2-Launcher

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/ps2homebrew/ps2homebrew:main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build PS2-Launcher
        run: |
          export PS2DEV=/usr/local/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin:$PATH
          
          # Compile full release
          make clean || true
          make -j$(nproc)

      - name: Package Full Release Bundle
        run: |
          mkdir -p release/PS2-Launcher
          
          # 1. ELFs
          cp *.ELF release/PS2-Launcher/ 2>/dev/null || true
          cp *.elf release/PS2-Launcher/ 2>/dev/null || true
          if [ -f "release/PS2-Launcher/PS2L.ELF" ]; then
            cp release/PS2-Launcher/PS2L.ELF release/PS2-Launcher/PS2-Launcher-4.0.0.ELF
          fi

          # 2. Languages
          mkdir -p release/PS2-Launcher/lng
          cp lng/*.lng release/PS2-Launcher/lng/ 2>/dev/null || true

          # 3. Fonts & Assets
          mkdir -p release/PS2-Launcher/fonts
          cp thirdparty/*.ttf release/PS2-Launcher/fonts/ 2>/dev/null || true

          # 4. Docs & License
          cp README.md CREDITS.md LICENSE release/PS2-Launcher/ 2>/dev/null || true

          # 5. Build Final Distribution Zip
          cd release && zip -r PS2-Launcher-v4.0.0-Release.zip PS2-Launcher

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PS2-Launcher-v4.0.0-Release
          path: release/